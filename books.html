
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4b - Question 2</title>
</head>
<body>

    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstTitle"></p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor"></p>

    <h2>Genres of Both Books</h2>
    <ul id="genreList"></ul>

    <p id="status" role="status" aria-live="polite"></p>

    <script>
        async function loadBooks() {
            const status = document.getElementById("status");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Failed to load JSON file");
                }

                const data = await response.json();
                const books = data.books;

                if (!Array.isArray(books) || books.length < 2 ||
                    books.some(book =>
                        typeof book.title !== "string" ||
                        typeof book.author !== "string" ||
                        !Array.isArray(book.genres)
                    )) {
                    throw new Error("Invalid book data");
                }

                document.getElementById("firstTitle").textContent =
                    books[0].title;

                document.getElementById("secondAuthor").textContent =
                    books[1].author;

                const genreList = document.getElementById("genreList");
                genreList.replaceChildren();

                for (let book of books) {
                    const item = document.createElement("li");

                    item.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genreList.appendChild(item);
                }

                status.textContent = "Books loaded successfully!";

            } catch (error) {
                status.textContent =
                    "Unable to load books. Please check the JSON file.";
            }
        }

        loadBooks();
    </script>

</body>
</html>
